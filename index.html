<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marcela Oliveira — Cartão Fidelidade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Inter"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#FAF6EF] text-stone-800 min-h-screen antialiased font-sans">
  <div id="app" class="hidden max-w-2xl mx-auto px-4 py-7 sm:py-11">
    <!-- Cabeçalho -->
    <header class="mb-7 flex items-center justify-between gap-3">
      <div>
        <p class="text-[11px] uppercase tracking-[0.25em] text-yellow-700 font-semibold mb-1">
          Cartão VIP Digital
        </p>
        <h1 class="font-serif text-3xl sm:text-4xl font-bold tracking-tight text-stone-900">
          Marcela Oliveira
        </h1>
        <p class="text-xs sm:text-sm uppercase tracking-[0.18em] text-yellow-700 font-medium mt-1">
          Extensão de Cílios em Tela
        </p>
      </div>
      <span
        id="total-clientes"
        class="shrink-0 text-xs font-semibold bg-white/90 border border-yellow-300 text-yellow-800 px-3.5 py-1.5 rounded-full shadow-sm"
      >
        0 clientes
      </span>
    </header>

    <!-- Formulário de cadastro -->
    <section class="bg-white rounded-2xl shadow-md shadow-amber-950/5 border border-yellow-200/90 p-4 mb-6">
      <form id="form-cliente" class="flex flex-col sm:flex-row gap-3">
        <label for="input-nome" class="sr-only">Nome da cliente</label>
        <input
          id="input-nome"
          type="text"
          required
          autocomplete="off"
          placeholder="Nome da cliente VIP..."
          class="flex-1 rounded-xl border border-yellow-300/80 bg-amber-50/40 px-4 py-3 text-base text-stone-800 placeholder:text-stone-400 focus:bg-white focus:border-yellow-500 focus:outline-none focus:ring-2 focus:ring-yellow-500/20 transition"
        />
        <button
          id="btn-adicionar"
          type="submit"
          class="rounded-xl bg-gradient-to-r from-yellow-400 via-amber-500 to-yellow-600 px-5 py-3 text-sm font-semibold text-stone-950 shadow-sm shadow-yellow-600/20 hover:from-yellow-500 hover:to-yellow-700 active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed transition cursor-pointer"
        >
          Adicionar Cliente
        </button>
      </form>
    </section>

    <!-- Mensagens de status / aviso -->
    <div id="status-mensagem" class="hidden mb-4 rounded-xl px-4 py-3 text-sm font-medium"></div>

    <!-- Lista de clientes -->
    <main>
      <div id="lista-clientes" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </main>
  </div>

  <script>
    const SENHA_ACESSO = '1234';
    const META_VISITAS = 10;

    // Dados do projeto Supabase (TrendTracker)
    const SUPABASE_URL = 'https://swmjmmosjdglpalimpoy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VF1kDKrHNnn16n8C1vAVoA_f8m-CbJZ';

    let supabaseClient = null;

    const appEl = document.getElementById('app');
    const formEl = document.getElementById('form-cliente');
    const inputNomeEl = document.getElementById('input-nome');
    const btnAdicionarEl = document.getElementById('btn-adicionar');
    const listaEl = document.getElementById('lista-clientes');
    const statusEl = document.getElementById('status-mensagem');
    const totalClientesEl = document.getElementById('total-clientes');

    function exibirStatus(mensagem, tipo = 'info') {
      const estilos = {
        info: 'bg-amber-50 text-amber-900 border border-yellow-300',
        erro: 'bg-rose-50 text-rose-800 border border-rose-200',
        aviso: 'bg-amber-50 text-yellow-800 border border-yellow-400'
      };
      statusEl.className = `mb-4 rounded-xl px-4 py-3 text-sm font-medium ${estilos[tipo] || estilos.info}`;
      statusEl.textContent = mensagem;
      statusEl.classList.remove('hidden');
    }

    function limparStatus() {
      statusEl.classList.add('hidden');
      statusEl.textContent = '';
    }

    function inicializarSupabase() {
      if (
        !SUPABASE_URL ||
        SUPABASE_URL === 'SUA_URL_AQUI' ||
        !SUPABASE_KEY ||
        SUPABASE_KEY === 'SUA_CHAVE_AQUI'
      ) {
        exibirStatus(
          'Configure SUA_URL_AQUI e SUA_CHAVE_AQUI no arquivo index.html para conectar ao Supabase.',
          'aviso'
        );
        return false;
      }

      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        return true;
      } catch (err) {
        exibirStatus('Erro ao inicializar Supabase: ' + err.message, 'erro');
        return false;
      }
    }

    function obterDataHoje() {
      return new Date().toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: '2-digit'
      });
    }

    function criarBotaoAcaoSecundaria(texto, ariaLabel, classeExtra, aoClicar) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = texto;
      btn.setAttribute('aria-label', ariaLabel);
      btn.className = `inline-flex items-center gap-1 rounded-lg px-2 py-1 text-xs font-medium transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed ${classeExtra}`;
      btn.addEventListener('click', aoClicar);
      return btn;
    }

    function criarGradeCarimbos(historico, atingiuMeta) {
      const painel = document.createElement('div');
      painel.className = atingiuMeta
        ? 'rounded-xl bg-amber-100/60 border border-yellow-400/80 p-3'
        : 'rounded-xl bg-amber-50/70 border border-yellow-200/80 p-3';

      const grade = document.createElement('div');
      grade.className = 'grid grid-cols-5 gap-2 place-items-center';

      for (let i = 0; i < META_VISITAS; i += 1) {
        const carimbo = historico[i];
        const preenchido = typeof carimbo === 'string' && carimbo.length > 0;

        const slot = document.createElement('div');
        slot.className = preenchido
          ? 'w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-gradient-to-br from-yellow-300 via-amber-400 to-yellow-600 border-2 border-yellow-500 text-stone-950 flex flex-col items-center justify-center shadow-sm shadow-yellow-600/20 select-none transition'
          : 'w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-white/80 border-2 border-dashed border-yellow-300 text-yellow-700/50 flex items-center justify-center text-[11px] font-medium select-none transition';

        if (preenchido) {
          const coroa = document.createElement('span');
          coroa.className = 'text-[9px] leading-none';
          coroa.setAttribute('aria-hidden', 'true');
          coroa.textContent = '👑';

          const dataEl = document.createElement('span');
          dataEl.className = 'text-[10px] font-bold leading-tight tracking-tight';
          dataEl.textContent = carimbo;

          slot.appendChild(coroa);
          slot.appendChild(dataEl);
        } else {
          slot.textContent = String(i + 1);
        }

        slot.title = preenchido ? `Visita ${i + 1}: ${carimbo}` : `Visita ${i + 1}: pendente`;
        grade.appendChild(slot);
      }

      painel.appendChild(grade);
      return painel;
    }

    function renderizarClientes(clientes) {
      listaEl.innerHTML = '';
      const quantidade = clientes.length;
      totalClientesEl.textContent = `${quantidade} ${quantidade === 1 ? 'cliente' : 'clientes'}`;

      if (quantidade === 0) {
        const vazio = document.createElement('div');
        vazio.className =
          'col-span-full bg-white/90 border border-dashed border-yellow-300 rounded-2xl p-8 text-center text-sm text-stone-500';
        vazio.textContent = 'Nenhuma cliente cadastrada ainda. Adicione a primeira acima.';
        listaEl.appendChild(vazio);
        return;
      }

      clientes.forEach((cliente) => {
        const historico = Array.isArray(cliente.historico_visitas)
          ? cliente.historico_visitas
          : [];
        const visitas = historico.length;
        const atingiuMeta = visitas >= META_VISITAS;

        const card = document.createElement('article');
        card.className = atingiuMeta
          ? 'rounded-2xl border-2 border-yellow-500 bg-gradient-to-br from-amber-50 via-[#FFFDF5] to-yellow-100/70 p-5 shadow-lg shadow-yellow-500/20 ring-2 ring-yellow-400/40 flex flex-col justify-between gap-4 transition'
          : 'rounded-2xl border border-yellow-200 bg-gradient-to-br from-white via-[#FFFDF9] to-amber-50/40 p-5 shadow-md shadow-amber-950/5 flex flex-col justify-between gap-4 transition';

        const topo = document.createElement('div');
        topo.className = 'flex items-start justify-between gap-3';

        const info = document.createElement('div');
        info.className = 'min-w-0';

        const nomeEl = document.createElement('h2');
        nomeEl.className = 'font-serif font-bold text-lg text-stone-900 truncate';
        nomeEl.textContent = cliente.nome;

        const contagemEl = document.createElement('p');
        contagemEl.className = 'text-xs uppercase tracking-wider font-semibold text-yellow-700 mt-0.5';
        contagemEl.textContent = `${visitas}/${META_VISITAS} visitas`;

        info.appendChild(nomeEl);
        info.appendChild(contagemEl);

        const btnMaisUm = document.createElement('button');
        btnMaisUm.type = 'button';
        btnMaisUm.textContent = '+1';
        btnMaisUm.disabled = atingiuMeta;
        btnMaisUm.setAttribute('aria-label', `Adicionar visita para ${cliente.nome}`);
        btnMaisUm.className = atingiuMeta
          ? 'shrink-0 rounded-xl bg-amber-100 border border-yellow-300 text-yellow-700 px-4 py-2.5 text-sm font-bold cursor-not-allowed opacity-75'
          : 'shrink-0 rounded-xl bg-stone-900 hover:bg-stone-800 active:scale-95 text-amber-300 border border-yellow-500/60 px-4 py-2.5 text-sm font-bold shadow-sm transition cursor-pointer';

        btnMaisUm.addEventListener('click', async () => {
          btnMaisUm.disabled = true;
          await marcarVisita(cliente.id, historico);
        });

        topo.appendChild(info);
        topo.appendChild(btnMaisUm);

        const cartaoWrap = document.createElement('div');
        cartaoWrap.className = 'space-y-2.5';
        cartaoWrap.appendChild(criarGradeCarimbos(historico, atingiuMeta));

        if (atingiuMeta) {
          const badge = document.createElement('p');
          badge.className =
            'inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-amber-950 bg-gradient-to-r from-yellow-300 via-amber-300 to-yellow-400 border border-yellow-500 rounded-full px-3 py-1 shadow-xs';
          badge.textContent = '👑 Ganhou brinde!';
          cartaoWrap.appendChild(badge);
        }

        const acoesSecundarias = document.createElement('div');
        acoesSecundarias.className = atingiuMeta
          ? 'pt-2.5 border-t border-yellow-300/80 flex flex-wrap items-center justify-between gap-1'
          : 'pt-2.5 border-t border-yellow-200/70 flex flex-wrap items-center justify-between gap-1';

        const classeNeutra = 'text-amber-900/70 hover:text-amber-950 hover:bg-amber-100/70';

        const btnEditarNome = criarBotaoAcaoSecundaria(
          '✏️ Editar Nome',
          `Editar nome de ${cliente.nome}`,
          classeNeutra,
          async () => {
            await editarNome(cliente.id, cliente.nome);
          }
        );

        const btnEditarVisitas = criarBotaoAcaoSecundaria(
          '⚙️ Editar Visitas',
          `Editar visitas de ${cliente.nome}`,
          classeNeutra,
          async () => {
            await editarVisitas(cliente.id, historico);
          }
        );

        const btnExcluir = criarBotaoAcaoSecundaria(
          '🗑️ Excluir',
          `Excluir ${cliente.nome}`,
          'text-rose-700/75 hover:text-rose-800 hover:bg-rose-50',
          async () => {
            await excluirCliente(cliente.id);
          }
        );

        acoesSecundarias.appendChild(btnEditarNome);
        acoesSecundarias.appendChild(btnEditarVisitas);
        acoesSecundarias.appendChild(btnExcluir);

        card.appendChild(topo);
        card.appendChild(cartaoWrap);
        card.appendChild(acoesSecundarias);
        listaEl.appendChild(card);
      });
    }

    async function carregarClientes() {
      if (!supabaseClient) return;

      limparStatus();
      const { data, error } = await supabaseClient
        .from('clientes')
        .select('id, nome, visitas, historico_visitas')
        .order('nome', { ascending: true });

      if (error) {
        exibirStatus('Erro ao carregar clientes: ' + error.message, 'erro');
        return;
      }

      renderizarClientes(data || []);
    }

    async function adicionarCliente(nome) {
      const nomeLimpo = nome.trim();
      if (!nomeLimpo || !supabaseClient) return;

      btnAdicionarEl.disabled = true;
      limparStatus();

      const { error } = await supabaseClient
        .from('clientes')
        .insert([{ nome: nomeLimpo, visitas: 0, historico_visitas: [] }]);

      btnAdicionarEl.disabled = false;

      if (error) {
        exibirStatus('Erro ao adicionar cliente: ' + error.message, 'erro');
        return;
      }

      inputNomeEl.value = '';
      inputNomeEl.focus();
      await carregarClientes();
    }

    async function marcarVisita(id, historicoAtual) {
      const historico = Array.isArray(historicoAtual) ? historicoAtual : [];
      if (!supabaseClient || historico.length >= META_VISITAS) return;

      limparStatus();
      const novoHistorico = [...historico, obterDataHoje()];

      const { error } = await supabaseClient
        .from('clientes')
        .update({
          historico_visitas: novoHistorico,
          visitas: novoHistorico.length
        })
        .eq('id', id);

      if (error) {
        exibirStatus('Erro ao marcar visita: ' + error.message, 'erro');
        await carregarClientes();
        return;
      }

      await carregarClientes();
    }

    async function editarNome(id, nomeAtual) {
      if (!supabaseClient) return;

      const novoNome = prompt('Digite o novo nome:', nomeAtual);
      if (novoNome === null) return;

      const nomeLimpo = novoNome.trim();
      if (!nomeLimpo) {
        exibirStatus('O nome da cliente não pode ficar vazio.', 'aviso');
        return;
      }

      if (nomeLimpo === nomeAtual) return;

      limparStatus();
      const { error } = await supabaseClient
        .from('clientes')
        .update({ nome: nomeLimpo })
        .eq('id', id);

      if (error) {
        exibirStatus('Erro ao editar nome: ' + error.message, 'erro');
        return;
      }

      await carregarClientes();
    }

    async function editarVisitas(id, historicoAtual) {
      if (!supabaseClient) return;

      const historico = Array.isArray(historicoAtual) ? historicoAtual : [];
      const visitasAtuais = historico.length;

      const entrada = prompt('Defina o número exato de visitas (0 a 10):', visitasAtuais);
      if (entrada === null) return;

      const valorTexto = entrada.trim();
      if (!/^\d+$/.test(valorTexto)) {
        exibirStatus('Informe um número inteiro válido entre 0 e 10.', 'aviso');
        return;
      }

      const novasVisitas = Number(valorTexto);
      if (novasVisitas < 0 || novasVisitas > META_VISITAS) {
        exibirStatus(`O número de visitas deve estar entre 0 e ${META_VISITAS}.`, 'aviso');
        return;
      }

      if (novasVisitas === visitasAtuais) return;

      const novoHistorico =
        novasVisitas > visitasAtuais
          ? [...historico, ...Array(novasVisitas - visitasAtuais).fill('M')]
          : historico.slice(0, novasVisitas);

      limparStatus();
      const { error } = await supabaseClient
        .from('clientes')
        .update({
          historico_visitas: novoHistorico,
          visitas: novoHistorico.length
        })
        .eq('id', id);

      if (error) {
        exibirStatus('Erro ao atualizar visitas: ' + error.message, 'erro');
        return;
      }

      await carregarClientes();
    }

    async function excluirCliente(id) {
      if (!supabaseClient) return;

      const confirmado = confirm('Tem certeza que deseja excluir esta cliente? Ação irreversível.');
      if (!confirmado) return;

      limparStatus();
      const { error } = await supabaseClient
        .from('clientes')
        .delete()
        .eq('id', id);

      if (error) {
        exibirStatus('Erro ao excluir cliente: ' + error.message, 'erro');
        return;
      }

      await carregarClientes();
    }

    formEl.addEventListener('submit', async (event) => {
      event.preventDefault();
      await adicionarCliente(inputNomeEl.value);
    });

    // Bloqueio de segurança simples ao abrir a página
    (function iniciar() {
      const senhaDigitada = prompt('Digite a senha para acessar:');
      if (senhaDigitada !== SENHA_ACESSO) {
        document.body.innerHTML = '';
        document.body.className = 'bg-white';
        return;
      }

      appEl.classList.remove('hidden');
      if (inicializarSupabase()) {
        carregarClientes();
      }
    })();
  </script>
</body>
</html>
